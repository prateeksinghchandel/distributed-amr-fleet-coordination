# pytest configuration for the backend test suite.
#
# asyncio_mode = auto  +  asyncio_default_fixture_loop_scope = function
# make pytest-asyncio run each async test AND its fixtures in the *same*
# function-scoped event loop. Without this, aiohttp's TestClient binds its
# session to the fixture loop, so requests made from the per-test loop fail
# with "Timeout context manager should be used inside a task".
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function